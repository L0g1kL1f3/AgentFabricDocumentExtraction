[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-fabric-document-extraction"
version = "0.3.1"
description = "Validation helpers for Microsoft Fabric document extraction pipelines."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Joni Fortunato"}]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["fabricagent", "fabricagent.*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
